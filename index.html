<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-container">
        <div class="profile-card">
            <img src="img.jpeg"
                 alt="My profile picture"
                 class="profile-image">
            <p class="profile-label">STUDENT DEVELOPER</p>
            <h1>Adeena Sajad</h1>
            <h2>Cybersecurity Student</h2>
            <p class="profile-description">
                I am currently pursuing my BTech.
                in CSE Cybersecurity and Blockchain.
                I am passionate about technology,
                learning how to build
                creative websites.
            </p>
            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>Python</span>
            </div>
            <a href="https://ums.lpu.in/lpuums/"
               target="_blank"
               rel="noopener noreferrer"
               class="profile-button">
                View Profile
            </a>
        </div>
    </main>
</body>
</html>
